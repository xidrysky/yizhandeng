<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0813">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>一个小东西</title>
<meta name="description" content="没有大事，就是留了个小东西在这儿。">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#efe4d3;
    --dim:#9b8f86;
    --gold:#f0c98d;
    --rose:#f0a3a8;
    --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",SimSun,serif;
    --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  }
  html,body{height:100%;background:#0a0813}
  body{
    font-family:var(--sans);color:var(--ink);
    overflow:hidden;position:fixed;inset:0;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* 顶部提示，几秒后自动淡出 */
  #hint{
    position:fixed;left:0;right:0;top:calc(16% + env(safe-area-inset-top));
    text-align:center;pointer-events:none;
    font-family:var(--serif);font-size:15px;letter-spacing:.14em;
    color:rgba(239,228,211,.5);
    opacity:0;animation:hintIn .9s ease .8s forwards, hintOut 1.4s ease 6.5s forwards;
  }
  @keyframes hintIn{to{opacity:1}}
  @keyframes hintOut{to{opacity:0}}

  /* 底部两行 */
  #foot{
    position:fixed;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));
    text-align:center;pointer-events:none;padding:0 28px;
  }
  #foot p{
    font-family:var(--serif);font-size:14px;line-height:1.9;
    letter-spacing:.06em;color:rgba(239,228,211,.62);
  }
  #foot .tiny{
    margin-top:6px;font-size:11.5px;letter-spacing:.1em;color:rgba(239,228,211,.26);
  }
  @media (min-height:760px){
    #foot{bottom:calc(34px + env(safe-area-inset-bottom))}
    #foot p{font-size:14.5px}
  }
  @media (prefers-reduced-motion: reduce){
    #hint{animation:hintIn .01s ease forwards, hintOut .01s ease 6.5s forwards}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">戳它一下</div>
<div id="foot">
  <p>它有点黏人，但不会真的烦你。</p>
  <p class="tiny">一行一行敲的，没有模板。</p>
</div>

<script>
(function(){
'use strict';

var PI2 = Math.PI * 2;
var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d');
var W = 0, H = 0, DPR = 1;
var now = 0;

/* ---------------- 尺寸 ---------------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cvs.clientWidth  || window.innerWidth;
  H = cvs.clientHeight || window.innerHeight;
  cvs.width  = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  B.r      = Math.max(34, Math.min(Math.min(W, H) * 0.118, 66));
  B.restX  = W * 0.5;
  B.restY  = H * 0.415;
  if(!B.placed){ B.x = B.restX; B.y = B.restY; B.placed = true; }
  B.x = Math.max(B.r + 8, Math.min(W - B.r - 8, B.x));
  B.y = Math.max(B.r + 70, Math.min(H - B.r - 110, B.y));
  buildStars();
  buildDust();
  buildBg();
}

/* ---------------- 背景星空 ---------------- */
var stars = [], shoots = [];
function buildStars(){
  stars = [];
  var n = Math.round(Math.min(96, (W * H) / 9000));
  for(var i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.4 + Math.random() * 1.15,
      a: 0.14 + Math.random() * 0.5,
      sp: 0.6 + Math.random() * 1.8,
      ph: Math.random() * PI2,
      warm: Math.random() < 0.24
    });
  }
}
var dust = [], vignette = null;
function buildDust(){
  dust = [];
  var n = Math.round(Math.min(26, (W * H) / 26000));
  for(var i = 0; i < n; i++){
    dust.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.5 + Math.random() * 1.3,
      a: 0.10 + Math.random() * 0.28,
      sp: 0.4 + Math.random() * 1.6,
      ph: Math.random() * PI2,
      warm: Math.random() < 0.55
    });
  }
}
var bgGrad = null;
function buildBg(){
  bgGrad = ctx.createLinearGradient(0, 0, W * 0.35, H);
  bgGrad.addColorStop(0,    '#0b0916');
  bgGrad.addColorStop(0.45, '#0a0813');
  bgGrad.addColorStop(0.78, '#0c0a16');
  bgGrad.addColorStop(1,    '#120d1b');

  var cx0 = W * 0.5, cy0 = H * 0.44;
  vignette = ctx.createRadialGradient(cx0, cy0, Math.min(W, H) * 0.26, cx0, cy0, Math.max(W, H) * 0.80);
  vignette.addColorStop(0,   'rgba(0,0,0,0)');
  vignette.addColorStop(0.6, 'rgba(0,0,0,0.16)');
  vignette.addColorStop(1,   'rgba(0,0,0,0.46)');
}

/* ---------------- 小东西本体 ---------------- */
var B = {
  x: 0, y: 0, vx: 0, vy: 0, r: 50,
  restX: 0, restY: 0, placed: false,
  sx: 1, sy: 1, rot: 0, spin: 0,
  blink: 0, blinkT: 1200 + Math.random() * 1800,
  asleep: false, sleepK: 0, curl: 0, curlT: 0,
  look: {x: 0, y: 0},
  foot: 0, footV: 0,
  mouth: 0,
  lamp: 0.55, lampT: 0.55,
  happy: 0
};

/* ---------------- 指针 ---------------- */
var ptr = { x: 0, y: 0, active: false, last: 0, down: 0, downAt: 0, moved: false };
var lastAct = 0;

/* ---------------- 气泡 ---------------- */
var say = { text: '', t0: -9999, dur: 0, a: 0 };

/* ---------------- 粒子 ---------------- */
var parts = [];

/* ---------------- 声音 ---------------- */
var AC = null;
function initAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
  }catch(e){ AC = null; }
}
function boop(f, vol, dur, type){
  if(!AC) return;
  if(AC.state === 'suspended'){ AC.resume(); }
  var t = AC.currentTime;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 1.55, t + 0.07);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.26));
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + (dur || 0.26) + 0.02);
}

/* ---------------- 说话 ---------------- */
var lastLine = '';
function speak(text, dur){
  if(!text) return;
  if(text === lastLine){ return; }
  lastLine = text;
  say.text = text; say.t0 = now; say.dur = (dur || 2500);
}

var LINES = [
  '嗯？',
  '我在这儿呢。',
  '你今天怎么有空。',
  '别戳了，痒。',
  '等一下，我在想事情。',
  '你也睡不着？',
  '……好吧，你赢了。',
  '刚才那下有点重。',
  '再戳我就走了。',
  '我不吵你，你忙你的。',
  '一直都在的。'
];
var lineIdx = 0;
function pickLine(){
  lineIdx = (lineIdx + 3 + Math.floor(Math.random() * 4)) % LINES.length;
  return LINES[lineIdx];
}

/* ---------------- 交互 ---------------- */
var taps = 0, tapTimes = [];

function spark(px, py, n, power){
  for(var i = 0; i < n; i++){
    var a = Math.random() * PI2;
    var s = (power || 1) * (30 + Math.random() * 130);
    parts.push({
      x: px + (Math.random() - 0.5) * 8,
      y: py + (Math.random() - 0.5) * 8,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 40,
      life: 0.55 + Math.random() * 0.75,
      age: 0,
      r: 0.9 + Math.random() * 2.1,
      warm: Math.random() < 0.5
    });
  }
}

function onTap(px, py){
  initAudio();
  lastAct = now;

  // 睡着被戳
  if(B.asleep){
    B.asleep = false;
    B.sy = 0.78; B.sx = 1.2;
    speak(taps > 1 ? '我没睡。' : '嗯？', 1900);
    boop(660, 0.05, 0.2);
    spark(B.x, B.y - B.r * 0.4, 5, 0.6);
    return;
  }

  taps++;
  tapTimes.push(now);
  if(tapTimes.length > 6) tapTimes.shift();

  B.sy = 0.74; B.sx = 1.26;
  B.vy = -170 - Math.random() * 70;
  B.mouth = 1;
  spark(px, py, 7, 1);
  boop(470 + Math.random() * 130 + Math.min(taps, 10) * 9, 0.075, 0.24);

  // 戳太急
  if(tapTimes.length >= 4 && now - tapTimes[0] < 900){
    speak('痒！', 1400);
    return;
  }
  // 里程碑
  if(taps === 15){
    B.lampT = 1.0; B.happy = 1;
    speak('灯给你留着。', 3000);
    spark(B.x, B.y - B.r, 16, 1.4);
    return;
  }
  if(taps === 26){
    B.spin = PI2; B.happy = 1;
    speak('今天够了，剩下的明天。', 3200);
    spark(B.x, B.y, 22, 1.6);
    return;
  }
  if(taps % 6 === 0){
    B.spin = PI2;
    B.happy = 1;
    spark(B.x, B.y, 12, 1.3);
    speak(pickLine(), 2400);
    return;
  }
  if(taps <= 2 || Math.random() < 0.55){
    speak(pickLine(), 2300);
  }
}

function onDown(e){
  var p = point(e);
  ptr.x = p.x; ptr.y = p.y; ptr.active = true; ptr.last = now;
  ptr.down = now; ptr.moved = false;
  lastAct = now;
  if(e.cancelable) e.preventDefault();
}

function onMove(e){
  var p = point(e);
  if(ptr.down && Math.abs(p.x - ptr.x) + Math.abs(p.y - ptr.y) > 6) ptr.moved = true;
  ptr.x = p.x; ptr.y = p.y;
  ptr.active = e.pointerType === 'mouse' || !!ptr.down;
  ptr.last = now;
  if(ptr.active) lastAct = now;
  if(e.cancelable && ptr.down) e.preventDefault();
}

function onUp(e){
  var held = now - ptr.down;
  if(!ptr.moved && held < 780){
    onTap(ptr.x, ptr.y);
  }else if(!ptr.moved && held >= 780){
    B.curl = 1; B.curlT = 1.6;
    speak('这样也行，安静一会儿。', 2600);
    lastAct = now;
  }
  ptr.down = 0;
  if(e && e.pointerType !== 'mouse'){ ptr.active = false; }
}

function point(e){
  if(e.touches && e.touches[0]) return {x: e.touches[0].clientX, y: e.touches[0].clientY};
  return {x: e.clientX, y: e.clientY};
}

function bindInput(){
  if(window.PointerEvent){
    cvs.addEventListener('pointerdown', onDown, {passive:false});
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp, {passive:true});
    window.addEventListener('pointercancel', function(){ ptr.down = 0; ptr.active = false; }, {passive:true});
  }else{
    cvs.addEventListener('touchstart', onDown, {passive:false});
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('touchend', onUp, {passive:true});
    cvs.addEventListener('mousedown', onDown, false);
    window.addEventListener('mousemove', onMove, false);
    window.addEventListener('mouseup', onUp, false);
  }
  // 双击缩放兜底
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, false);
}

/* ---------------- 更新 ---------------- */
function update(dt, ts){
  var idle = now - lastAct;

  // 睡着 / 醒来
  if(!ptr.down && idle > 7200 && !B.asleep){
    B.asleep = true; lastLine = '';
  }
  if(idle < 7200 && B.asleep && ptr.down){
    B.asleep = false;
  }
  B.sleepK += ((B.asleep ? 1 : 0) - B.sleepK) * Math.min(1, dt * 2.4);

  // 松手后卷起 / 展开
  if(B.curlT > 0) B.curlT -= dt;
  var cT = B.curlT > 0 ? 0.9 : 0;
  B.curl += (cT - B.curl) * Math.min(1, dt * 6);

  // 目标位置
  var bob = Math.sin(ts * 0.0011) * (B.asleep ? 3 : 7);
  var tx = B.restX, ty = B.restY + bob;
  if(ptr.active && !B.asleep && ptr.down){
    tx = ptr.x;
    ty = ptr.y - B.r * 0.85;
  }else if(ptr.active && !B.asleep && ptr.last > now - 2600){
    tx = ptr.x + Math.sin(ts * 0.0014) * 26;
    ty = ptr.y - B.r * 0.9 + Math.cos(ts * 0.0013) * 18;
  }
  tx = Math.max(B.r + 10, Math.min(W - B.r - 10, tx));
  ty = Math.max(B.r + 78, Math.min(H - B.r - 96, ty));

  // 弹簧
  var k = 30, d = 8.2;
  B.vx += (tx - B.x) * k * dt; B.vx -= B.vx * d * dt; B.x += B.vx * dt;
  B.vy += (ty - B.y) * k * dt; B.vy -= B.vy * d * dt; B.y += B.vy * dt;

  // 形变回弹
  B.sx += (1 - B.sx) * Math.min(1, dt * 9);
  B.sy += (1 - B.sy) * Math.min(1, dt * 9);
  // 速度带来的牵拉
  var sp = Math.min(1, Math.sqrt(B.vx * B.vx + B.vy * B.vy) / 900);
  B.sx += sp * 0.1 * dt * 8;
  B.sy -= sp * 0.09 * dt * 8;

  // 旋转
  if(B.spin !== 0){
    var step = Math.sign(B.spin) * Math.min(Math.abs(B.spin), dt * 14);
    B.rot += step; B.spin -= step;
    if(Math.abs(B.spin) < 0.001){ B.spin = 0; B.rot = 0; }
  }else{
    B.rot += (0 - B.rot) * Math.min(1, dt * 6);
  }

  // 注视方向
  var lx = 0, ly = 0;
  if(ptr.active && now - ptr.last < 4000 && !B.asleep){
    var dx = ptr.x - B.x, dy = ptr.y - B.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    lx = dx / dist; ly = dy / dist;
  }else{
    lx = Math.sin(ts * 0.0006) * 0.55;
    ly = 0.12;
  }
  B.look.x += (lx - B.look.x) * Math.min(1, dt * 5);
  B.look.y += (ly - B.look.y) * Math.min(1, dt * 5);

  // 眨眼
  B.blinkT -= dt * 1000;
  if(B.blinkT <= 0 && B.sleepK < 0.6){
    B.blink = 1;
    B.blinkT = 1500 + Math.random() * 2600;
  }
  if(B.blink > 0) B.blink = Math.max(0, B.blink - dt * 7);

  // 嘴巴
  B.mouth = Math.max(0, B.mouth - dt * 2.2);

  // 灯
  B.lamp += (B.lampT - B.lamp) * Math.min(1, dt * 3);
  if(B.lampT > 0.6) B.lampT -= dt * 0.05;

  // 脚
  var targetFoot = Math.sin(ts * 0.0021) * (B.asleep ? 0.15 : 0.55) + sp * 1.2;
  B.footV += (targetFoot - B.foot) * 26 * dt;
  B.footV *= Math.pow(0.02, dt);
  B.foot += B.footV * dt;

  // 粒子
  for(var i = parts.length - 1; i >= 0; i--){
    var p = parts[i];
    p.age += dt;
    if(p.age >= p.life){ parts.splice(i, 1); continue; }
    p.vy += 240 * dt;
    p.vx *= Math.pow(0.12, dt);
    p.vy *= Math.pow(0.35, dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  // 流星
  if(Math.random() < dt * 0.06 && shoots.length < 2){
    shoots.push({
      x: Math.random() * W * 0.8, y: Math.random() * H * 0.4,
      vx: 220 + Math.random() * 160, vy: 90 + Math.random() * 70,
      age: 0, life: 0.9 + Math.random() * 0.5
    });
  }
  for(var j = shoots.length - 1; j >= 0; j--){
    var s = shoots[j];
    s.age += dt;
    if(s.age >= s.life){ shoots.splice(j, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
  }

  // 气泡透明度
  var age = now - say.t0;
  var a = 0;
  if(age < 220) a = age / 220;
  else if(age < say.dur - 320) a = 1;
  else if(age < say.dur) a = (say.dur - age) / 320;
  say.a = Math.max(0, Math.min(1, a));
  if(age >= say.dur){ say.text = ''; }
}

/* ---------------- 绘制 ---------------- */
function roundRect(x0, y0, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.arcTo(x0 + w, y0, x0 + w, y0 + h, r);
  ctx.arcTo(x0 + w, y0 + h, x0, y0 + h, r);
  ctx.arcTo(x0, y0 + h, x0, y0, r);
  ctx.arcTo(x0, y0, x0 + w, y0, r);
  ctx.closePath();
}

function drawSky(t){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 中央一点点暖光，让画面不是纯黑
  var g = ctx.createRadialGradient(W * 0.5, H * 0.43, 0, W * 0.5, H * 0.43, Math.max(W, H) * 0.62);
  g.addColorStop(0, 'rgba(120,86,120,0.16)');
  g.addColorStop(0.55, 'rgba(70,52,90,0.07)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for(var i = 0; i < stars.length; i++){
    var s = stars[i];
    var tw = 0.55 + 0.45 * Math.sin(t * 0.001 * s.sp + s.ph);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = s.warm ? '#ffe6c2' : '#dfe6ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, PI2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 浮尘
  for(var q = 0; q < dust.length; q++){
    var d0 = dust[q];
    var dy0 = (d0.y - t * 0.00004 * d0.sp * 1000) % H;
    if(dy0 < 0) dy0 += H;
    var tw0 = 0.35 + 0.65 * Math.sin(t * 0.0012 * d0.sp + d0.ph);
    ctx.globalAlpha = d0.a * tw0;
    ctx.fillStyle = d0.warm ? '#ffe3bd' : '#e6e2ff';
    ctx.beginPath(); ctx.arc(d0.x + Math.sin(t * 0.0008 + d0.ph) * 6, dy0, d0.r, 0, PI2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 暗角
  if(vignette){
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  for(var j = 0; j < shoots.length; j++){
    var sh = shoots[j];
    var k = 1 - sh.age / sh.life;
    var gr = ctx.createLinearGradient(sh.x, sh.y, sh.x - sh.vx * 0.16, sh.y - sh.vy * 0.16);
    gr.addColorStop(0, 'rgba(255,240,214,' + (0.55 * k) + ')');
    gr.addColorStop(1, 'rgba(255,240,214,0)');
    ctx.strokeStyle = gr;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(sh.x, sh.y);
    ctx.lineTo(sh.x - sh.vx * 0.16, sh.y - sh.vy * 0.16);
    ctx.stroke();
  }
}

function drawParts(){
  ctx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < parts.length; i++){
    var p = parts[i];
    var k = 1 - p.age / p.life;
    ctx.globalAlpha = k * 0.85;
    ctx.fillStyle = p.warm ? '#ffd9a0' : '#ffd3dc';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.5 + k * 0.7), 0, PI2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawBlob(t){
  var r = B.r;
  var k = B.sleepK;
  var breathe = 1 + Math.sin(t * 0.0016) * (0.018 + k * 0.012);
  var sx = B.sx * breathe * (1 - B.curl * 0.16);
  var sy = B.sy * (2 - breathe) * (1 + B.curl * 0.06);

  // 光晕
  var halo = ctx.createRadialGradient(B.x, B.y, r * 0.15, B.x, B.y, r * 2.5);
  var hA = (0.20 - k * 0.09) * B.lamp;
  halo.addColorStop(0,   'rgba(255,206,150,' + (hA * 1.5) + ')');
  halo.addColorStop(0.45,'rgba(255,176,150,' + (hA * 0.45) + ')');
  halo.addColorStop(1,   'rgba(255,160,150,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(B.x, B.y, r * 2.5, 0, PI2);
  ctx.fill();

  ctx.save();
  ctx.translate(B.x, B.y);
  ctx.rotate(B.rot);
  ctx.scale(sx, sy);

  // 身体
  var body = ctx.createLinearGradient(0, -r * 1.05, 0, r * 1.05);
  body.addColorStop(0,   '#ffeccd');
  body.addColorStop(0.52,'#ffd9a8');
  body.addColorStop(1,   '#f3b98a');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, PI2);
  ctx.fill();

  // 顶部高光
  ctx.globalAlpha = 0.55;
  var hi = ctx.createRadialGradient(-r * 0.34, -r * 0.46, 0, -r * 0.34, -r * 0.46, r * 0.72);
  hi.addColorStop(0, 'rgba(255,255,246,0.85)');
  hi.addColorStop(1, 'rgba(255,255,246,0)');
  ctx.fillStyle = hi;
  ctx.beginPath();
  ctx.arc(-r * 0.34, -r * 0.46, r * 0.72, 0, PI2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // 下半部压暗，才有体积
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, PI2); ctx.clip();
  var sh2 = ctx.createLinearGradient(0, -r * 0.1, 0, r * 1.05);
  sh2.addColorStop(0, 'rgba(196,116,78,0)');
  sh2.addColorStop(1, 'rgba(196,116,78,0.30)');
  ctx.fillStyle = sh2;
  ctx.fillRect(-r, -r, r * 2, r * 2);
  ctx.restore();

  // 边缘暗一点，才有体积
  ctx.strokeStyle = 'rgba(190,120,86,0.22)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0, 0, r - 0.6, 0, PI2);
  ctx.stroke();

  // 腮红
  ctx.globalAlpha = 0.34;
  ctx.fillStyle = '#f79a9a';
  ctx.beginPath(); ctx.ellipse(-r * 0.52, r * 0.22, r * 0.19, r * 0.12, 0, 0, PI2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r * 0.52, r * 0.22, r * 0.19, r * 0.12, 0, 0, PI2); ctx.fill();
  ctx.globalAlpha = 1;

  // 眼睛
  var ex = r * 0.31, ey = -r * 0.02;
  var eyeH = (0.5 + 0.5 * (1 - B.blink)) * (1 - k * 0.86);
  var eyeW = 0.20;
  for(var s = -1; s <= 1; s += 2){
    var cx = s * ex;
    if(eyeH < 0.1){
      // 闭眼：一条弧
      ctx.strokeStyle = 'rgba(72,44,36,0.85)';
      ctx.lineWidth = r * 0.045;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, ey + r * 0.02, r * 0.13, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
    }else{
      ctx.fillStyle = '#4a2c24';
      ctx.beginPath();
      ctx.ellipse(cx, ey, r * eyeW * eyeH, r * 0.155 * eyeH, 0, 0, PI2);
      ctx.fill();
      // 眼里的高光
      if(eyeH > 0.5){
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = '#fff8ee';
        ctx.beginPath();
        ctx.arc(cx - r * 0.035 + B.look.x * r * 0.02, ey - r * 0.05 * eyeH,
                r * 0.045 * eyeH, 0, PI2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // 嘴巴
  var mo = Math.max(B.mouth, B.happy * 0.7);
  if(B.asleep){
    ctx.strokeStyle = 'rgba(90,54,44,0.6)';
    ctx.lineWidth = r * 0.035;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, r * 0.26, r * 0.07, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  }else if(mo > 0.12){
    ctx.fillStyle = '#8e4f45';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.30, r * 0.075, r * (0.05 + mo * 0.06), 0, 0, PI2);
    ctx.fill();
  }else{
    ctx.strokeStyle = 'rgba(110,64,50,0.75)';
    ctx.lineWidth = r * 0.035;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, r * 0.20, r * 0.10, Math.PI * 0.22, Math.PI * 0.78);
    ctx.stroke();
  }

  // 头顶的小触角 + 灯
  var sway = Math.sin(t * 0.0019) * 0.12 + B.foot * 0.08;
  var tipX = Math.sin(sway) * r * 0.34;
  var tipY = -r * 1.02 - r * 0.52;
  ctx.strokeStyle = 'rgba(214,158,110,0.55)';
  ctx.lineWidth = Math.max(1, r * 0.035);
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.96);
  ctx.quadraticCurveTo(tipX * 0.4, -r * 1.05 - r * 0.30, tipX, tipY);
  ctx.stroke();

  var lampR = r * (0.105 + B.lamp * 0.04) * (1 + Math.sin(t * 0.004) * 0.05);
  var lg = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, lampR * 3.4);
  lg.addColorStop(0, 'rgba(255,244,206,' + (0.95 * B.lamp) + ')');
  lg.addColorStop(0.28, 'rgba(255,206,132,' + (0.55 * B.lamp) + ')');
  lg.addColorStop(1, 'rgba(255,180,110,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.arc(tipX, tipY, lampR * 3.4, 0, PI2); ctx.fill();

  ctx.fillStyle = 'rgba(255,252,238,' + (0.75 + 0.25 * B.lamp) + ')';
  ctx.beginPath(); ctx.arc(tipX, tipY, lampR, 0, PI2); ctx.fill();

  // 两只小脚
  ctx.fillStyle = '#eeb47f';
  var fy = r * 0.96;
  ctx.beginPath(); ctx.ellipse(-r * 0.30, fy + B.foot * r * 0.10, r * 0.15, r * 0.10, 0, 0, PI2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r * 0.30, fy - B.foot * r * 0.10, r * 0.15, r * 0.10, 0, 0, PI2); ctx.fill();

  ctx.restore();

  // 睡着时的 z
  if(k > 0.15){
    ctx.globalAlpha = k * 0.6;
    ctx.fillStyle = 'rgba(239,228,211,0.9)';
    ctx.font = '600 ' + Math.round(r * 0.30) + 'px ui-rounded,' + "'PingFang SC','Hiragino Sans GB',sans-serif";
    for(var i = 0; i < 3; i++){
      var ph = (t * 0.0006 + i * 0.33) % 1;
      ctx.globalAlpha = k * 0.55 * (1 - ph);
      ctx.fillText('z', B.x + r * (0.92 + ph * 0.5), B.y - r * 1.62 - ph * r * 0.85);
    }
    ctx.globalAlpha = 1;
  }
}

function drawBubble(){
  var tm = ctx.getTransform();
  if(!say.text || say.a <= 0.01) return;
  var fs = Math.max(14, Math.min(17, B.r * 0.34));
  var font = fs.toFixed(1) + 'px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  ctx.font = font;
  var tw = ctx.measureText(say.text).width;
  var padX = fs * 0.95, padY = fs * 0.62;
  var w = tw + padX * 2, h = fs + padY * 2;
  var bx = B.x, by = B.y - B.r * 2.02 - h;

  bx = Math.max(w / 2 + 14, Math.min(W - w / 2 - 14, bx));
  by = Math.max(70, by);

  ctx.save();
  ctx.globalAlpha = say.a;
  // 尾巴
  ctx.fillStyle = 'rgba(26,21,38,0.92)';
  ctx.beginPath();
  ctx.moveTo(bx - 9, by + h - 1);
  ctx.lineTo(bx + 9, by + h - 1);
  ctx.lineTo(bx + 1, by + h + 8);
  ctx.closePath();
  ctx.fill();

  roundRect(bx - w / 2, by, w, h, Math.min(16, h / 2));
  ctx.fillStyle = 'rgba(26,21,38,0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(243,201,139,0.30)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = 'rgba(246,235,219,0.96)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(say.text, bx, by + h / 2 + 0.5);
  ctx.restore();
}

function render(t){
  drawSky(t);
  drawParts();
  drawBlob(t);
  drawBubble();
}


/* ---------------- 主循环 ---------------- */
var raf = 0, lastT = 0;
function frame(ts){
  now = ts;
  if(!lastT) lastT = ts;
  var dt = Math.min(0.045, (ts - lastT) / 1000);
  lastT = ts;
  update(dt, ts);
  render(ts);
  raf = requestAnimationFrame(frame);
}

/* ---------------- 启动 ---------------- */
function start(){
  resize();
  bindInput();
  window.addEventListener('resize', function(){ resize(); }, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); }, {passive:true});
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ cancelAnimationFrame(raf); }
    else{ lastT = 0; raf = requestAnimationFrame(frame); }
  }, {passive:true});
  raf = requestAnimationFrame(frame);
}
start();

})();
</script>
